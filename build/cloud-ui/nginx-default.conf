server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: unknown paths fall back to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Vite emits content-hashed files under assets/immutable/
  location /assets/immutable/ {
    expires 1y;
    access_log off;
    add_header Cache-Control "public, immutable";
  }

  # Never cache the entry point, so a new build is picked up immediately
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
}
