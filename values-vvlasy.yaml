# Values for the existing deployment in namespace `jetkvm` (api.jetkvm.vvlasy.cz / jetkvm.vvlasy.cz).
# Names, selectors, secrets and the PVC template match what is running today, so the chart
# can adopt the live resources instead of recreating them. See README, "Adopting".
#
#   helm upgrade --install jetkvm charts/jetkvm-cloud -n jetkvm -f values-vvlasy.yaml

api:
  name: cloud-api
  image:
    repository: ghcr.io/vvlasy/jetkvm-cloud-api
    tag: d08418e
  # The existing Secret `cloud-api` already holds every env var (secrets and config).
  # Keys below in `config` override the same keys in that Secret, because the ConfigMap
  # is loaded after it.
  existingSecret: cloud-api
  config:
    PORT: "3000"
    API_HOSTNAME: https://api.jetkvm.vvlasy.cz
    APP_HOSTNAME: https://jetkvm.vvlasy.cz
    CORS_ORIGINS: https://jetkvm.vvlasy.cz
    ICE_SERVERS: stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302
    # Lowercase on purpose; the live value `X-Real-IP` never matched (Node lowercases headers),
    # so device IPs were logged as Traefik's pod IP.
    REAL_IP_HEADER: x-real-ip
    # ALLOWED_IDENTITIES deliberately not set here: it stays in the Secret, where it is
    # currently empty (= any Google account may sign in). Put your e-mail there to lock it down.
  ingress:
    enabled: true
    className: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.tls.certresolver: default
    host: api.jetkvm.vvlasy.cz
    tls:
      - {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi

ui:
  name: cloud-ui
  image:
    repository: ghcr.io/vvlasy/jetkvm-cloud-ui
    tag: "0.5.9"
  ingress:
    enabled: true
    className: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.tls.certresolver: default
    host: jetkvm.vvlasy.cz
    tls:
      - {}
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

postgres:
  enabled: true
  name: postgres
  # Existing Secret `postgres` (POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB).
  # DATABASE_URL stays in the `cloud-api` Secret.
  existingSecret: postgres
  image:
    repository: postgres
    tag: 16-alpine
  persistence:
    # Must stay exactly as the live StatefulSet: claim `data`, 5Gi, longhorn, RWO.
    claimName: data
    storageClassName: longhorn
    accessModes: ["ReadWriteOnce"]
    size: 5Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
