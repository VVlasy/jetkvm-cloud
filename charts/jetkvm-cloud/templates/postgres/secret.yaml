{{- if and .Values.postgres.enabled (not .Values.postgres.existingSecret) }}
{{- if not .Values.postgres.auth.password }}
{{- fail "postgres.auth.password is required when postgres.enabled=true and postgres.existingSecret is empty" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jetkvm-cloud.postgres.name" . }}
  labels:
    {{- include "jetkvm-cloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.auth.database | quote }}
{{- end }}
