{{- $name := include "jetkvm-cloud.ui.name" . }}
{{- $apiUrl := default .Values.api.config.API_HOSTNAME .Values.ui.cloudApiUrl }}
{{- if not $apiUrl }}
{{- fail "ui.cloudApiUrl or api.config.API_HOSTNAME must be set" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "jetkvm-cloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: cloud-ui
spec:
  replicas: {{ .Values.ui.replicaCount }}
  strategy:
    {{- toYaml .Values.ui.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "jetkvm-cloud.selectorLabels" (dict "name" $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "jetkvm-cloud.selectorLabels" (dict "name" $name) | nindent 8 }}
        {{- include "jetkvm-cloud.labels" . | nindent 8 }}
        app.kubernetes.io/component: cloud-ui
        {{- with .Values.ui.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.ui.nginxConfig .Values.ui.podAnnotations }}
      annotations:
        {{- if .Values.ui.nginxConfig }}
        checksum/nginx-config: {{ include (print $.Template.BasePath "/ui/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.ui.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: nginx
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          env:
            - name: CLOUD_API_URL
              value: {{ $apiUrl | quote }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          {{- with .Values.ui.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.ui.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.ui.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.ui.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.ui.nginxConfig }}
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          {{- end }}
      {{- if .Values.ui.nginxConfig }}
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ $name }}-nginx
      {{- end }}
      {{- with .Values.ui.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
