{{- if not .Values.api.existingSecret }}
{{- $dbUrl := include "jetkvm-cloud.api.databaseUrl" . }}
{{- if not $dbUrl }}
{{- fail "api.secret.DATABASE_URL is required when postgres.enabled=false or postgres.existingSecret is set" }}
{{- end }}
{{- if not .Values.api.secret.COOKIE_SECRET }}
{{- fail "api.secret.COOKIE_SECRET is required (e.g. `openssl rand -hex 32`)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jetkvm-cloud.api.name" . }}
  labels:
    {{- include "jetkvm-cloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: cloud-api
type: Opaque
stringData:
  DATABASE_URL: {{ $dbUrl | quote }}
  {{- range $k, $v := .Values.api.secret }}
  {{- if ne $k "DATABASE_URL" }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
  {{- end }}
{{- end }}
